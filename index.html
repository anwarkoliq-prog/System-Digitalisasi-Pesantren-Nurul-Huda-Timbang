<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Digitalisasi PesantrenNH</title>

  <!-- Ikon untuk tab browser (Desktop & Mobile) -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" type="image/png" href="icon.png">
  <!-- Ikon saat aplikasi disimpan ke layar utama (iOS & Android) -->

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyWFtO8LLL0PQnFX1VmLR_DtdAhFcCwDhMOPoK6jSvonM6RX_LRoZ9r7Radm0M0W7lH8A/exec"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
    allowfullscreen>
  </iframe>
